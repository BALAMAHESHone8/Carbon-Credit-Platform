<!DOCTYPE html>
<html>

<head>

<title>Register | Carbon Nexus AI</title>

<link rel="stylesheet" href="css/auth.css">

</head>


<body>


<div class="auth-box">


<h2>Create Account 🌱</h2>


<form id="registerForm">


<input 
id="name"
type="text"
placeholder="Name"
required>


<input 
id="email"
type="email"
placeholder="Email"
required>


<input 
id="password"
type="password"
placeholder="Password"
required>


<button type="submit">
Register
</button>


</form>


<p>
Already have account?
<a href="login.html">
Login
</a>
</p>


</div>



<script src="js/register.js"></script>


</body>

</html>
